; Plotter GPS nautico - versione LilyGO T-Deck Plus
; Porting del progetto "plotter" per ESP32 CYD.
; Definizione board e configurazione display dal repository ufficiale Xinyuan-LilyGO/T-Deck.

[platformio]
boards_dir = boards
default_envs = T-Deck

[env:T-Deck]
platform = espressif32@6.5.0
board = T-Deck
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags =
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	; Configurazione TFT_eSPI per il display ST7789 320x240 della T-Deck
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_MISO=38
	-DTFT_MOSI=41
	-DTFT_SCLK=40
	-DTFT_CS=12
	-DTFT_DC=11
	-DTFT_RST=-1
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
lib_deps =
	bodmer/TFT_eSPI@2.5.43
	lewisxhe/SensorLib@0.2.1
	mikalhart/TinyGPSPlus@^1.0.3
	bodmer/TJpg_Decoder@^1.1.0
