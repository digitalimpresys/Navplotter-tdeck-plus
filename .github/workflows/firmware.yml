# Compila il firmware del T-Deck Plus e del nodo Heltec (V3 e V2) e prepara le immagini uniche per la pagina
# flasher (Navplotter-Flasher): boot loader, tabella delle partizioni e applicazione uniti in un solo file
# (tdeck-plus.bin, heltec-v3-node.bin, heltec-v2-node.bin).
# Parte da sola a ogni modifica del firmware o della web app, oppure a mano dalla scheda Actions.
name: Firmware T-Deck e Heltec

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "include/**"
      - "web/**"
      - "tools/embed_web.py"
      - "platformio.ini"
      - "boards/**"
      - "navplotter-heltec/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini', 'navplotter-heltec/platformio.ini') }}

      - name: PlatformIO
        run: pip install platformio

      - name: Compila
        run: |
          pio run -e T-Deck
          pio run -d navplotter-heltec -e heltec_wifi_lora_32_V3 -e heltec_wifi_lora_32_V2

      - name: Immagini uniche per il flasher
        run: |
          APP0=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          ESPTOOL=~/.platformio/packages/tool-esptoolpy/esptool.py
          # Il boot loader sta a 0 sull'ESP32-S3 e a 0x1000 sull'ESP32
          merge() {
            python $ESPTOOL --chip $1 merge_bin -o $2 $3 $4/bootloader.bin 0x8000 $4/partitions.bin 0xe000 $APP0 0x10000 $4/firmware.bin
          }
          merge esp32s3 tdeck-plus.bin 0x0 .pio/build/T-Deck
          merge esp32s3 heltec-v3-node.bin 0x0 navplotter-heltec/.pio/build/heltec_wifi_lora_32_V3
          merge esp32 heltec-v2-node.bin 0x1000 navplotter-heltec/.pio/build/heltec_wifi_lora_32_V2
          ls -l *.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: "*.bin"

      # Le ultime immagini anche nel ramo "firmware" (sempre sostituite),
      # così si può prendere con git e copiare nella pagina flasher.
      - name: Ramo firmware
        run: |
          mkdir out && cp *.bin out/ && cd out
          git init -q -b firmware
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.bin
          git commit -q -m "immagini da ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" firmware
