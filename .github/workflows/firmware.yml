# Compila il firmware del T-Deck Plus e prepara l'immagine unica per la pagina flasher (Navplotter-Flasher):
# boot loader, tabella delle partizioni e applicazione uniti in tdeck-plus.bin, da scrivere all'indirizzo 0.
# Parte da sola a ogni modifica del firmware o della web app, oppure a mano dalla scheda Actions.
name: Firmware T-Deck

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "include/**"
      - "web/**"
      - "tools/embed_web.py"
      - "platformio.ini"
      - "boards/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: PlatformIO
        run: pip install platformio

      - name: Compila
        run: pio run -e T-Deck

      - name: Immagine unica per il flasher
        run: |
          B=.pio/build/T-Deck
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin \
            -o tdeck-plus.bin \
            0x0 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
          ls -l tdeck-plus.bin

      - uses: actions/upload-artifact@v4
        with:
          name: tdeck-plus
          path: tdeck-plus.bin

      # L'ultima immagine anche nel ramo "firmware" (un solo file, sempre sostituito),
      # così si può prendere con git e copiare nella pagina flasher.
      - name: Ramo firmware
        run: |
          mkdir out && cp tdeck-plus.bin out/ && cd out
          git init -q -b firmware
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tdeck-plus.bin
          git commit -q -m "tdeck-plus.bin da ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" firmware
