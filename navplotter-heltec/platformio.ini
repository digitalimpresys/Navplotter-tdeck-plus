; NavPlotter node for Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262, 868 MHz) with an external GPS module.
; The board does the navigation work and serves a web app over its own WiFi network.

[platformio]
default_envs = heltec_wifi_lora_32_V3

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Turns web/index.html into src/web_page.h before every build
extra_scripts = pre:tools/embed_web.py
lib_deps =
	jgromes/RadioLib@^6.6.0
	olikraus/U8g2@^2.35.19
	mikalhart/TinyGPSPlus@^1.0.3

[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3
upload_speed = 921600

; The older V2: ESP32 and SX1276 radio. Same firmware, other pins (see the top of src/main.cpp).
[env:heltec_wifi_lora_32_V2]
board = heltec_wifi_lora_32_V2
upload_speed = 460800
build_flags = -DBOARD_HELTEC_V2
